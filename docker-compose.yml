services:
 postgres:
  image: postgres:15
  container_name: event-space-postgres
  environment:
   POSTGRES_DB: ${POSTGRES_DB}
   POSTGRES_USER: ${POSTGRES_USER}
   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  ports:
   - '${POSTGRES_PORT:-5432}:5432'
  volumes:
   - postgres_data:/var/lib/postgresql/data
  networks:
   - event-network
  restart: unless-stopped
  healthcheck:
   test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
   interval: 10s
   timeout: 5s
   retries: 5

 redis:
  image: redis:7-alpine
  container_name: event-space-redis
  ports:
   - '${REDIS_PORT:-6379}:6379'
  volumes:
   - redis_data:/data
  networks:
   - event-network
  command: redis-server --save 60 1 --loglevel warning
  restart: unless-stopped
  healthcheck:
   test: ['CMD', 'redis-cli', 'ping']
   interval: 10s
   timeout: 5s
   retries: 5

networks:
 event-network:
  driver: bridge

volumes:
 postgres_data:
 redis_data:
