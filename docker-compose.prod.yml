services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    container_name: event-space-api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - event-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:5000/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx-api:
    image: nginx:1.27-alpine
    container_name: event-space-nginx-api
    ports:
      - '${API_PORT:-5000}:80'
    volumes:
      - ./infra/nginx/api-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - event-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
      args:
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
        API_URL: http://api:5000
    container_name: event-space-web
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_URL: http://api:5000
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    depends_on:
      - api
    networks:
      - event-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:15
    container_name: event-space-postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - event-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: event-space-redis
    volumes:
      - redis_data:/data
    networks:
      - event-network
    command: redis-server --save 60 1 --loglevel warning
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  event-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
